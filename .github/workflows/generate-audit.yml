name: Generate Master Audit Report

on:
  workflow_dispatch:

jobs:
  generate-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject Environment Variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Run Master Audit
        run: npm run generate-audit

      - name: Commit and Push Audit Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update Master Audit Report [skip ci]"
          file_pattern: 'audit/**'
          commit_user_name: "Audit Bot"
          commit_user_email: "audit-bot@aiutarsi.it"
          branch: main
