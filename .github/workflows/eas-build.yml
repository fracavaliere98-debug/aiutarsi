name: EAS Build & Maestro Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build Android & Run Maestro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AiutarSiApp/package-lock.json

      - name: Install dependencies
        working-directory: AiutarSiApp
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK (Preview)
        id: build
        working-directory: AiutarSiApp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Esegue la build su EAS Cloud e cattura l'ID della build
          BUILD_ID=$(eas build --platform android --profile preview --non-interactive --json | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Get Build URL
        id: get_url
        working-directory: AiutarSiApp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Recupera l'URL dell'artifact (APK) usando l'ID della build
          URL=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.artifacts.buildUrl')
          echo "build_url=$URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.get_url.outputs.build_url }}" -o app.apk

      - name: Run Maestro Cloud flows
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: app.apk
          workspace: .maestro/
          name: "${{ github.workflow }} #${{ github.run_number }} - ${{ github.ref_name }}"
