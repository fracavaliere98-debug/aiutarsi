name: EAS Preview Build

on:
  workflow_dispatch:

jobs:
  build_preview:
    name: Build Android Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (Preview)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(CI=1 eas build --platform android --profile preview --environment preview --non-interactive --json | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Failed to resolve EAS build ID"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Get Build URL
        id: get_url
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.artifacts.buildUrl')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to resolve build artifact URL"
            exit 1
          fi
          echo "build_url=$URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.get_url.outputs.build_url }}" -o aiutarsi-preview.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiutarsi-preview-apk
          path: aiutarsi-preview.apk
          retention-days: 7

      - name: Add Build Summary
        run: |
          {
            echo "## EAS Preview Build"
            echo ""
            echo "- Build ID: \`${{ steps.build.outputs.build_id }}\`"
            echo "- APK Artifact: \`aiutarsi-preview-apk\`"
            echo "- Download URL: ${{ steps.get_url.outputs.build_url }}"
          } >> $GITHUB_STEP_SUMMARY
