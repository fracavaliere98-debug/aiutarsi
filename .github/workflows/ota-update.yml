# Trigger: ogni push su main
# Flusso: Maestro smoke tests → OTA update su branch preview
name: OTA Update (Preview)

on:
  push:
    branches:
      - main

jobs:
  test-and-update:
    name: Smoke Test → OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AiutarSiApp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: AiutarSiApp

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Maestro smoke tests su emulatore Android ──────────────────────────
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── Build Android APK per i test E2E ──────────────────────────────────
      - name: Build Android Release APK
        working-directory: AiutarSiApp
        run: |
          # Popola l'env file (assicurati che nei Settings di GitHub -> Secrets and Variables le chiavi ci siano)
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          
          # Genera cartella android pulita e builda in Release
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Run Maestro smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Installa l'APK Release appena generato sull'emulatore
            adb install AiutarSiApp/android/app/build/outputs/apk/release/app-release.apk

            # Esegui tutti i flow Maestro - Metro bundler NON è necessario per Release
            cd AiutarSiApp
            maestro test .maestro/flows/

      # ── OTA Update (solo se i test passano) ───────────────────────────────
      - name: EAS OTA Update → branch preview
        run: eas update --branch preview --platform all --non-interactive --message "CI: ${{ github.sha }}"
        working-directory: AiutarSiApp
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
