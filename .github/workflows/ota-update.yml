# Trigger: ogni push su main
# Flusso: Maestro smoke tests → OTA update su branch preview
name: OTA Update (Preview)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-update:
    name: Smoke Test → OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_CLI_NO_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Maestro smoke tests su emulatore Android ──────────────────────────
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Inject Staging env vars
            echo "EXPO_PUBLIC_SUPABASE_URL=https://pavnfiladmnwbptwlwpr.supabase.co" > .env
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhdm5maWxhZG1ud2JwdHdsd3ByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNTgyMzEsImV4cCI6MjA4NjgzNDIzMX0.pmW7FTzjz9QMKhRlILtnvL_DMXYX0HkhpnEkM7WQ39M" >> .env
            
            # Prebuild and Compile Android (Debug)
            npx expo prebuild --platform android --clean
            cd android
            ./gradlew assembleDebug
            
            # Install compiled APK
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            cd ..
            
            # Start Metro bundler in background
            npx expo start --no-dev --minify &
            sleep 15
            
            # Run Maestro test flows against the installed com.aiutarsi.app
            maestro test .maestro/flows/

      # ── OTA Update (solo se i test passano) ───────────────────────────────
      - name: EAS OTA Update → branch preview
        run: |
          eas update --branch preview --platform all --non-interactive --message "CI: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
