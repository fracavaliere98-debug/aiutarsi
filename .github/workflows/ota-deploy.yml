# Trigger: ogni push su main
# Flusso: lint + regression suite (22 contract test a logica pura) + prod migration
# readiness -> OTA automatico su preview (staging) -> OTA su production solo dopo
# approvazione manuale (GitHub Environment "production" con required reviewers)
name: OTA Deploy (Fast)

on:
  push:
    branches:
      - main

concurrency:
  group: ota-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --pretty false

      - name: Validate env contract
        run: npm run validate:env-contract

  unit-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm run test:regression

      - name: Run prod migration readiness checks
        run: npm run test:prod-migration-readiness

  ota-update:
    name: Fast OTA Deploy
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS OTA Update → branch preview
        run: |
          CI=1 eas update --branch preview --environment preview --message "Fast OTA: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ota-deploy-production:
    name: OTA Deploy to Production (on request)
    runs-on: ubuntu-latest
    needs: ota-update
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.4.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS OTA Update → branch production
        run: |
          CI=1 eas update --branch production --environment production --message "Prod OTA: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
