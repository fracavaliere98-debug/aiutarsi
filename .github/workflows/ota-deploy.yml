# Trigger: ogni push su main
# Flusso: Aggiornamento rapido OTA (Over-The-Air)
name: OTA Deploy (Fast)

on:
  push:
    branches:
      - main

concurrency:
  group: ota-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apk_changed: ${{ steps.filter.outputs.apk }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check Whether APK Shell Must Change
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apk:
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'metro.config.js'
              - 'babel.config.js'
              - 'android/**'
              - 'ios/**'

  build-apk:
    name: Prepare Android APK
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app.json', 'package-lock.json', 'package.json', 'eas.json', 'metro.config.js', 'babel.config.js') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore cached APK
        id: apk-cache
        if: needs.detect-changes.outputs.apk_changed != 'true'
        uses: actions/cache@v4
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-v2-${{ runner.os }}-${{ hashFiles('app.json', 'package-lock.json', 'package.json', 'eas.json', 'metro.config.js', 'babel.config.js', 'android/**', 'ios/**') }}
          restore-keys: |
            apk-v2-${{ runner.os }}-

      - name: Inject Environment Variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Android Debug APK
        if: needs.detect-changes.outputs.apk_changed == 'true' || steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  test-apk:
    name: Smoke Test APK
    runs-on: ubuntu-latest
    needs: build-apk
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test maestro/flows/ --debug-output maestro-debug

      - name: Upload Maestro debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-logs
          path: maestro-debug/
          retention-days: 3

  ota-update:
    name: Fast OTA Deploy
    runs-on: ubuntu-latest
    needs: test-apk
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inject Environment Variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: EAS OTA Update → branch preview
        run: |
          eas update --branch preview --platform all --non-interactive --message "Fast OTA: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
