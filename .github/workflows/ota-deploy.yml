# Trigger: ogni push su main
# Flusso: Aggiornamento rapido OTA (Over-The-Air)
name: OTA Deploy (Fast)

on:
  push:
    branches:
      - main

jobs:
  ota-update:
    name: Fast OTA Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS OTA Update → branch preview
        run: |
          eas update --branch preview --platform all --non-interactive --message "Fast OTA: ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
