# Maestro Smoke Test — Esplora + Candidatura
# Prerequisito: login.yaml deve essere passato prima (flow separato)

appId: ${APP_ID}

---

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Se siamo sulla Landing Page, naviga al login (opzionale, ignorato se non visibile)
- tapOn:
    id: "btn-landing-login"
    optional: true

- assertVisible:
    id: "input-email"

# ── Login rapido ──────────────────────────────────────────────────────────────
- tapOn:
    id: "input-email"
- inputText: "test.maestro@aiutarsi.it"
- tapOn:
    id: "input-password"
- inputText: "TestMaestro123!"
- tapOn:
    id: "btn-login"

- tapOn:
    text: "Non ora"
    optional: true

- waitForAnimationToEnd
- assertVisible:
    id: "tab-home"

# ── Naviga al tab Esplora ─────────────────────────────────────────────────────
- tapOn:
    id: "tab-explore"
- waitForAnimationToEnd

# Verifica che la lista attività sia caricata
- assertVisible:
    id: "activity-list"
- assertVisible:
    id: "activity-card-0"

# Tap sulla prima card attività
- tapOn:
    id: "activity-card-0"
- waitForAnimationToEnd

# ── Pagina Dettaglio: verifica presenza pulsante Candidati ───────────────────
- assertVisible:
    id: "btn-activity-apply"

# Tap iscrizione attivita
- tapOn:
    id: "btn-activity-apply"
- waitForAnimationToEnd

# Verifica che la pagina riepilogo iscrizione si apra
- assertVisible:
    id: "btn-confirm-application"
- assertVisible:
    text: "Riepilogo Iscrizione"

- assertVisible:
    id: "btn-confirm-application"
