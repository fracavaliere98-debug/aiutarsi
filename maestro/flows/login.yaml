# Maestro Smoke Test — Login Flow
# Prerequisiti: app installata sul device/emulatore, account test creato
#
# Account di test consigliato — da creare su Supabase Dashboard:
#   email: test.maestro@aiutarsi.it
#   password: TestMaestro123!
#   role: VOLUNTEER

appId: ${APP_ID}

---

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "btn-landing-login"
    timeout: 20000

- tapOn:
    id: "btn-landing-login"

- extendedWaitUntil:
    visible:
      id: "input-email"
    timeout: 15000

# Inserisci le credenziali
- tapOn:
    id: "input-email"
- inputText: "test.maestro@aiutarsi.it"

- tapOn:
    id: "input-password"
- inputText: "TestMaestro123!"

# Tap su Accedi
- tapOn:
    id: "btn-login"

- tapOn:
    text: "Non ora"
    optional: true

# Attendi il caricamento della Home
- waitForAnimationToEnd
- assertVisible:
    id: "tab-home"

# Verifica che il tab bar sia visibile (segno di login riuscito)
- assertVisible:
    id: "tab-home"
