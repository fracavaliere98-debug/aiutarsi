# Maestro flow di esempio — Login
# Questo file va in .maestro/login.yml
#
# Maestro Cloud eseguirà tutti i file .yml in questa cartella.
# Documentazione flow: https://docs.maestro.dev/

appId: com.aiutarsi.app

---

# Verifica che la schermata di login sia visibile all'avvio
- assertVisible: "Accedi"

# Inserisce email e password di test
- tapOn:
    id: "email-input"
- inputText: "test@aiutarsi.com"

- tapOn:
    id: "password-input"
- inputText: "TestPassword123"

# Preme il bottone di login
- tapOn:
    id: "login-button"

# Aspetta che la home sia visibile (max 10 secondi)
- assertVisible:
    text: "Attività"
    timeout: 10000
